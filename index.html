<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Word Game</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7F4F8; --paper:#FFFFFF; --ink:#10324A; --soft:#4F6B7D;
  --blue:#1E8FB8; --deep:#0F5C7A; --sun:#FFCB3D; --pink:#E8457A;
  --line:#C6DFE9; --chip:#D8ECF3; --ok:#2E9B57; --bad:#D64563;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0C1C26;--paper:#142B39;--ink:#E3F1F7;--soft:#A3BECC;--blue:#5BC2E5;--deep:#8ED6EF;--line:#24465A;--chip:#1B3747;--ok:#5ACB83;--bad:#F2839A;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0C1C26;--paper:#142B39;--ink:#E3F1F7;--soft:#A3BECC;--blue:#5BC2E5;--deep:#8ED6EF;--line:#24465A;--chip:#1B3747;--ok:#5ACB83;--bad:#F2839A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;font-size:19px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;line-height:1.05;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
img{display:block;max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:20px 22px 40px}
.screen{display:none}.screen.on{display:block}

.hero{margin:10px 0 18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero h1{font-size:clamp(46px,7.5vw,84px);color:var(--deep);letter-spacing:-.01em}
.bubble{background:var(--sun);color:#10324A;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:24px;padding:10px 20px 6px;border-radius:24px 24px 24px 4px;transform:rotate(-3deg)}
.hero p{flex-basis:100%;margin:0;color:var(--soft);font-size:20px;max-width:46ch}
.pick h2{font-size:26px;margin:22px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 20px 10px 10px;border-radius:999px;background:var(--paper);border:3px solid var(--line);font-weight:700;font-size:20px;min-height:64px}
.opt .ic{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:24px}
.opt[aria-pressed="true"]{border-color:var(--deep);background:var(--deep);color:var(--paper)}
.opt[aria-pressed="true"] .ic{background:var(--paper)}
.go{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.big{background:var(--sun);color:#10324A;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:30px;padding:14px 40px 10px;border-radius:22px;box-shadow:0 6px 0 #C99A16;min-height:72px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #C99A16}
.ghost{padding:14px 22px;border-radius:18px;border:3px solid var(--line);background:var(--paper);font-weight:700;min-height:64px}
.best{color:var(--soft);font-size:18px;margin-top:14px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:14px;padding:12px 22px}
.quit{width:52px;height:52px;border-radius:50%;background:var(--paper);border:3px solid var(--line);font-size:22px;font-weight:700;flex:none}
.progress{flex:1;display:flex;gap:6px}
.progress i{flex:1;height:12px;border-radius:6px;background:var(--line)}
.progress i.ok{background:var(--ok)}.progress i.half{background:var(--sun)}.progress i.miss{background:var(--bad)}.progress i.now{background:var(--soft)}
.score{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:30px;color:var(--deep);min-width:3.2em;text-align:right}
.score small{display:block;margin-top:-6px;font:400 16px "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--soft)}
.stage{max-width:1000px;margin:0 auto;padding:4px 22px 30px;display:grid;gap:18px}
.q{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:clamp(26px,3.6vw,36px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.say{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;flex:none}
.say.huge{width:120px;height:120px;font-size:56px;margin:8px auto;display:block;box-shadow:0 6px 0 var(--deep)}
.photo{border-radius:28px;overflow:hidden;background:#fff;border:6px solid var(--paper);display:grid;place-items:center}
.photo img{width:100%;height:min(40vh,420px);object-fit:contain}
.fiword{background:var(--paper);border-radius:28px;padding:34px 20px;text-align:center;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:clamp(48px,9vw,90px);color:var(--deep)}
.fiword small{display:block;font:400 18px "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--soft)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ans{background:var(--paper);border:3px solid var(--line);border-radius:22px;min-height:84px;padding:12px 16px;font-size:26px;font-weight:700;line-height:1.15}
.ans.right{background:var(--ok);border-color:var(--ok);color:#fff}
.ans.wrong{background:var(--chip);border-color:var(--bad);color:var(--soft);text-decoration:line-through;text-decoration-color:var(--bad)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pic{border-radius:22px;overflow:hidden;border:5px solid var(--paper);background:#fff;position:relative;padding:0}
.pic img{width:100%;aspect-ratio:4/3;object-fit:contain}
.pic.right{border-color:var(--ok)}.pic.wrong{border-color:var(--bad)}.pic.wrong img{opacity:.3}
.pic.right::after{content:"✓";position:absolute;right:10px;top:8px;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;font-size:28px;font-weight:700;display:grid;place-items:center}

.spellrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.spellrow .photo{flex:1 1 260px}
.spellrow .photo img{height:min(30vh,300px)}
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;justify-content:center;min-height:70px}
.slots .art{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:34px;color:var(--soft);margin-right:8px}
.slot{width:48px;height:62px;border-bottom:5px solid var(--blue);display:grid;place-items:center;font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:40px;color:var(--ink)}
.slot.gap{width:22px;border:0}
.slot.fixed{border-color:transparent;color:var(--soft)}
.slots.right .slot{color:var(--ok);border-color:var(--ok)}
.slots.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{width:62px;height:66px;border-radius:16px;background:var(--paper);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;font-size:34px}
.tile:disabled{opacity:.2;box-shadow:none}
.tools{display:flex;gap:10px;justify-content:center}

.feedback{min-height:60px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.pts{font-family:"Baloo 2",system-ui,sans-serif;font-weight:800;background:var(--sun);color:#10324A;border-radius:999px;padding:4px 14px 0;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.next{margin-left:auto}
@media (min-width:900px) and (orientation:landscape){
  .pics{grid-template-columns:repeat(4,1fr)}
  .pic img{aspect-ratio:1}
  .stage.side{grid-template-columns:1.2fr 1fr;grid-template-areas:"q q" "a b" "fb fb"}
  .stage.side .q{grid-area:q}.stage.side>.photo,.stage.side>.fiword{grid-area:a}.stage.side .answers{grid-area:b;grid-template-columns:1fr}.stage.side .feedback{grid-area:fb}
  .stage.side .photo img{height:min(58vh,520px)}
}

.result{text-align:center;padding-top:30px}
.stars{font-size:72px;letter-spacing:8px;margin:10px 0}
.stars .off{filter:grayscale(1);opacity:.3}
.result h2{font-size:clamp(40px,6vw,64px);color:var(--deep)}
.result .sub{color:var(--soft);font-size:20px;margin:8px 0 26px}
.record{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:6px 18px;font-weight:700;animation:pop .5s ease-out}
.missed{text-align:left;margin:30px auto 0;max-width:860px}
.missed h3,.section h3{font-size:28px;margin:22px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--paper);border-radius:20px;overflow:hidden;border:3px solid var(--line);text-align:left;padding:0}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff}
.card b{display:block;padding:8px 12px 0;font-size:20px;line-height:1.15}
.card span{display:block;padding:0 12px 10px;color:var(--soft);font-size:17px}
.head{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.head h2{font-size:40px;color:var(--deep)}
.note{color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:560px){.answers{grid-template-columns:1fr}.ans{font-size:22px;min-height:66px}.slot{width:34px;font-size:30px}.tile{width:52px}}
</style>
</head>
<body>

<section class="screen on" id="start"><div class="wrap">
  <div class="hero">
    <h1>English words</h1>
    <div class="bubble">Here we go!</div>
    <p>Kuuntele, katso ja valitse oikea englanninkielinen sana. Ensimmäisellä yrityksellä saat 10 pistettä.</p>
  </div>
  <div class="pick">
    <h2>Mitkä sanat?</h2>
    <div class="row" data-group="topic">
      <button class="opt" data-v="kaikki" aria-pressed="true"><span class="ic">✨</span>Kaikki</button>
      <button class="opt" data-v="home" aria-pressed="false"><span class="ic">🏠</span>Koti</button>
      <button class="opt" data-v="pets" aria-pressed="false"><span class="ic">🐹</span>Eläimet</button>
      <button class="opt" data-v="family" aria-pressed="false"><span class="ic">👪</span>Perhe</button>
    </div>
    <h2>Miten pelataan?</h2>
    <div class="row" data-group="mode">
      <button class="opt" data-v="mix" aria-pressed="true"><span class="ic">🎲</span>Sekoitus</button>
      <button class="opt" data-v="pic" aria-pressed="false"><span class="ic">🖼️</span>Kuva ja sana</button>
      <button class="opt" data-v="listen" aria-pressed="false"><span class="ic">🔊</span>Kuuntele</button>
      <button class="opt" data-v="fi" aria-pressed="false"><span class="ic">🇫🇮</span>Suomesta englanniksi</button>
      <button class="opt" data-v="spell" aria-pressed="false"><span class="ic">✏️</span>Kirjoita</button>
    </div>
  </div>
  <div class="go">
    <button class="big" id="play">Aloita peli</button>
    <button class="ghost" id="list">📖 Sanalista</button>
  </div>
  <div class="best" id="best"></div>
</div></section>

<section class="screen" id="quiz">
  <div class="bar">
    <button class="quit" id="quit" aria-label="Lopeta peli">✕</button>
    <div class="progress" id="progress"></div>
    <div class="score"><span id="score">0</span><small>pistettä</small></div>
  </div>
  <div class="stage" id="stage"></div>
</section>

<section class="screen" id="result"><div class="wrap result" id="resultBox"></div></section>

<section class="screen" id="listScreen"><div class="wrap">
  <div class="head"><button class="quit" id="listBack" aria-label="Takaisin">✕</button><h2>Sanalista</h2></div>
  <p class="note">Napauta kuvaa, niin kuulet sanan englanniksi.</p>
  <div id="words"></div>
</div></section>

const TOPICS = {home:"Koti", pets:"Eläimet", family:"Perhe"};
const ROUND = 10;
const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const full = w => w.art + " " + w.en;

/* speech: British English if available */
let enVoice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    enVoice = vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }catch(e){}
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = enVoice ? enVoice.lang : "en-GB";
    if(enVoice) u.voice = enVoice;
    u.rate = .85;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* start */
const choice = {topic:"kaikki", mode:"mix"};
document.querySelectorAll("[data-group]").forEach(row => row.addEventListener("click", e => {
  const b = e.target.closest(".opt"); if(!b) return;
  row.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", o === b));
  choice[row.dataset.group] = b.dataset.v; showBest();
}));
const modeKey = () => "eng-best:" + choice.topic + ":" + choice.mode;
function showBest(){ const b = store.get(modeKey(), null); $("#best").textContent = b != null ? "Ennätyksesi tässä pelissä: " + b + " pistettä" : ""; }
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0,0); }

/* game */
let game = null;
const TYPES = ["pic","listen","fi","spell"];
function pool(){ return WORDS.filter(w => choice.topic === "kaikki" || w.topic === choice.topic); }
function startGame(){
  const words = shuffle(pool()).slice(0, ROUND);
  const offset = Math.floor(Math.random()*4);
  game = {qs: words.map((w,i) => ({w, type: choice.mode === "mix" ? TYPES[(i+offset)%4] : choice.mode})), i:0, score:0, streak:0, results:[], missed:new Map()};
  $("#progress").innerHTML = game.qs.map(() => "<i></i>").join("");
  $("#score").textContent = 0;
  show("quiz"); renderQ();
}
function others(w){ return shuffle(WORDS.filter(x => x.id !== w.id && x.topic === w.topic)).slice(0,3); }
function renderProgress(){ [...$("#progress").children].forEach((el,i) => el.className = game.results[i] || (i === game.i ? "now" : "")); }

function renderQ(){
  const q = game.qs[game.i], w = q.w;
  game.tries = 0; game.done = false;
  renderProgress();
  const st = $("#stage");
  const opts = shuffle([w, ...others(w)]);
  if(q.type === "pic" || q.type === "fi"){
    st.className = "stage side";
    st.innerHTML = `
      <div class="q">${q.type === "pic" ? "What is this? Mikä tämä on englanniksi?" : "Miten tämä sanotaan englanniksi?"}</div>
      ${q.type === "pic" ? `<div class="photo"><img src="${w.img}" alt=""></div>` : `<div class="fiword">${w.fi}<small>suomeksi</small></div>`}
      <div class="answers">${opts.map(o => `<button class="ans" data-id="${o.id}">${full(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
  } else if(q.type === "listen"){
    st.className = "stage";
    st.innerHTML = `
      <div class="q">Kuuntele. Mikä kuva on oikea?</div>
      <button class="say huge" data-say aria-label="Kuuntele uudestaan">🔊</button>
      <div class="pics">${opts.map(o => `<button class="pic" data-id="${o.id}"><img src="${o.img}" alt=""></button>`).join("")}</div>
      <div class="feedback" id="fb"></div>`;
    setTimeout(() => speak(full(w)), 350);
  } else {
    renderSpell(q); return;
  }
  st.querySelectorAll("[data-id]").forEach(b => b.addEventListener("click", () => choose(b, q)));
  const sb = st.querySelector("[data-say]"); if(sb) sb.onclick = () => speak(full(w));
}

function choose(btn, q){
  if(game.done || btn.classList.contains("wrong")) return;
  game.tries++;
  if(btn.dataset.id === q.w.id){ btn.classList.add("right"); win(q); }
  else {
    btn.classList.add("wrong"); game.streak = 0;
    if(game.tries >= 2){ $("#stage").querySelector(`[data-id="${q.w.id}"]`).classList.add("right"); lose(q); }
    else { const fb = $("#fb"); fb.className = "feedback bad"; fb.textContent = "Melkein! Yritä vielä kerran."; }
  }
}
function win(q){
  game.done = true;
  const first = game.tries === 1;
  const pts = first ? 10 : 5;
  if(first) game.streak++; else { game.streak = 0; game.missed.set(q.w.id, q.w); }
  const bonus = first && game.streak % 3 === 0 ? 5 : 0;
  game.score += pts + bonus;
  game.results[game.i] = first ? "ok" : "half";
  const fb = $("#fb"); fb.className = "feedback ok";
  fb.innerHTML = `${first ? "Great!" : "Good!"} ${full(q.w)} = ${q.w.fi} <span class="pts">+${pts}</span>${bonus ? `<span class="pts">🔥 +${bonus}</span>` : ""}`;
  speak(full(q.w)); after();
}
function lose(q){
  game.done = true; game.results[game.i] = "miss"; game.missed.set(q.w.id, q.w);
  const fb = $("#fb"); fb.className = "feedback bad";
  fb.innerHTML = `Oikea vastaus: ${full(q.w)} = ${q.w.fi}`;
  speak(full(q.w)); after();
}
function after(){
  $("#score").textContent = game.score; renderProgress();
  const last = game.i === game.qs.length - 1;
  const b = document.createElement("button");
  b.className = "big next"; b.textContent = last ? "Katso tulos" : "Seuraava";
  b.onclick = () => { if(last) endGame(); else { game.i++; renderQ(); window.scrollTo(0,0); } };
  $("#fb").appendChild(b);
}

/* spelling */
function renderSpell(q){
  const w = q.w, chars = [...w.en];
  const st = $("#stage"); st.className = "stage";
  const letters = chars.map((c,i) => ({c,i})).filter(x => /[a-z]/i.test(x.c));
  st.innerHTML = `
    <div class="q">Kirjoita englanniksi: ${w.fi} <button class="say" data-say aria-label="Kuuntele">🔊</button></div>
    <div class="spellrow"><div class="photo"><img src="${w.img}" alt=""></div></div>
    <div class="slots" id="slots"><span class="art">${w.art}</span>${chars.map((c,i) => /[a-z]/i.test(c) ? `<span class="slot" data-i="${i}"></span>` : c === " " ? `<span class="slot gap"></span>` : `<span class="slot fixed">${c}</span>`).join("")}</div>
    <div class="tiles" id="tiles">${shuffle(letters).map((x,k) => `<button class="tile" data-k="${k}" data-c="${x.c}">${x.c}</button>`).join("")}</div>
    <div class="tools"><button class="ghost" id="undo">⌫ Pyyhi</button></div>
    <div class="feedback" id="fb"></div>`;
  const slots = [...st.querySelectorAll(".slot[data-i]")];
  const typed = [];
  st.querySelector("[data-say]").onclick = () => speak(full(w));
  st.querySelectorAll(".tile").forEach(t => t.onclick = () => {
    if(game.done || typed.length >= slots.length) return;
    slots[typed.length].textContent = t.dataset.c; t.disabled = true; typed.push(t);
    if(typed.length === slots.length) check();
  });
  $("#undo").onclick = () => { if(game.done || !typed.length) return; const t = typed.pop(); t.disabled = false; slots[typed.length].textContent = ""; };
  function check(){
    const guess = typed.map(t => t.dataset.c).join("");
    const want = letters.map(x => x.c).join("");
    game.tries++;
    if(guess.toLowerCase() === want.toLowerCase()){ $("#slots").classList.add("right"); $("#undo").disabled = true; win(q); return; }
    game.streak = 0;
    const s = $("#slots"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
    if(game.tries >= 2){
      slots.forEach((el,k) => el.textContent = letters[k].c);
      st.querySelectorAll(".tile").forEach(t => t.disabled = true);
      lose(q);
    } else {
      const fb = $("#fb"); fb.className = "feedback bad"; fb.textContent = "Melkein! Yritä vielä kerran. Kuuntele sana 🔊";
      setTimeout(() => { while(typed.length){ const t = typed.pop(); t.disabled = false; } slots.forEach(el => el.textContent = ""); }, 700);
    }
  }
}

function endGame(){
  const max = game.qs.length * 10, pct = game.score / max;
  const stars = pct >= .9 ? 3 : pct >= .6 ? 2 : 1;
  const prev = store.get(modeKey(), null), record = prev == null || game.score > prev;
  if(record) store.set(modeKey(), game.score);
  const msg = stars === 3 ? "Excellent! Olet sanamestari!" : stars === 2 ? "Well done! Vielä vähän harjoitusta." : "Good try! Kokeile uudestaan.";
  const missed = [...game.missed.values()];
  $("#resultBox").innerHTML = `
    ${record && prev != null ? '<div class="record">Uusi ennätys!</div>' : ""}
    <div class="stars">${[0,1,2].map(i => `<span class="${i < stars ? "" : "off"}">⭐</span>`).join("")}</div>
    <h2>${game.score} pistettä</h2>
    <p class="sub">${msg}</p>
    <div class="go" style="justify-content:center"><button class="big" id="again">Pelaa uudestaan</button><button class="ghost" id="home">Valitse toinen peli</button></div>
    ${missed.length ? `<div class="missed"><h3>Harjoittele näitä</h3><div class="grid">${missed.map(cardHtml).join("")}</div></div>` : ""}`;
  $("#again").onclick = startGame;
  $("#home").onclick = () => { showBest(); show("start"); };
  bindCards($("#resultBox"));
  show("result");
}
const cardHtml = w => `<button class="card" data-w="${w.id}"><img src="${w.img}" alt=""><b>${full(w)}</b><span>${w.fi}</span></button>`;
function bindCards(root){ root.querySelectorAll("[data-w]").forEach(c => c.onclick = () => speak(full(WORDS.find(w => w.id === c.dataset.w)))); }
function renderList(){
  $("#words").innerHTML = Object.entries(TOPICS).map(([k,t]) => `<div class="section"><h3>${t}</h3><div class="grid">${WORDS.filter(w => w.topic === k).map(cardHtml).join("")}</div></div>`).join("");
  bindCards($("#words"));
}

$("#play").onclick = startGame;
$("#quit").onclick = () => { if(confirm("Lopetetaanko peli?")){ showBest(); show("start"); } };
$("#list").onclick = () => { renderList(); show("listScreen"); };
$("#listBack").onclick = () => show("start");
showBest();
</script>
</body>
